name: keepalive

# Visita el servicio de Render cada ~5 min para que el plan free no lo duerma.
# Los workflows con "schedule" solo corren desde la rama por defecto (main).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render
        run: curl -fsS --retry 3 --retry-delay 5 --max-time 30 https://botskick.onrender.com/
